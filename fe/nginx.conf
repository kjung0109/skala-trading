server {
    listen 80;
    server_name _;

    # API는 백엔드 컨테이너로 넘긴다.
    # 개발 때 Vite 프록시가 하던 역할을 그대로 nginx가 맡는다.
    # 브라우저 입장에서는 같은 오리진이라 CORS 설정이 필요 없다.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 실시간 시세(SSE)를 위해 반드시 필요하다.
        # nginx는 기본적으로 응답을 모아서 보내는데, 그러면 이벤트가 흘러나오지 않고
        # 버퍼가 찰 때까지 화면이 멈춘 것처럼 보인다.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';

        # SSE 연결은 오래 열려 있다. 기본 타임아웃(60초)이면 계속 끊긴다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # 라우팅은 브라우저가 맡는다. /assets 같은 실제 파일이 아니면 index.html을 돌려준다.
        try_files $uri $uri/ /index.html;
    }

    # 해시가 붙은 정적 자산은 내용이 바뀌면 파일명도 바뀌므로 오래 캐시해도 안전하다.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
