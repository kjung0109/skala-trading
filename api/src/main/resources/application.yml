spring:
  application:
    name: skala-trading-api

  datasource:
    url: jdbc:h2:mem:tradingdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    # 봇이 초당 수십 건을 주문하므로 SQL을 다 찍으면 콘솔 출력이 병목이 된다.
    # 쿼리를 봐야 할 때만 켠다.
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  task:
    scheduling:
      # 호가 공급과 체결 유발이 각각 다른 주기로 돈다.
      # 스레드가 하나면 느린 쪽이 빠른 쪽을 밀어낸다.
      pool:
        size: 2

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

app:
  jwt:
    # 운영에서는 환경변수로 주입한다. 소스에 비밀키를 두지 않는다.
    secret: ${JWT_SECRET:skala-trading-api-local-development-secret-key-please-change-in-production}
    validity-seconds: 3600
  account:
    initial-balance: 100000000
  audit:
    # AOP 감사 로그에서 제외할 계좌. 시장을 굴리는 계좌는 사용자 행위가 아니다.
    exclude-accounts: market01,bot01,bot02

  bot:
    # 자동 매매 봇. 끄려면 false
    enabled: true
    interval-ms: 300        # 체결 유발 주기
    takers-per-tick: 6      # 한 번에 낼 체결 유발 주문 수 (초당 20건 체결 기준)
    market-ratio: 35        # 체결 유발 주문 중 시장가 비율(%)
    max-quantity: 15
    quote-interval-ms: 200  # 호가 공급 주기 (체결 속도를 따라가야 최우선호가가 비지 않는다)
    min-depth: 8            # 현재가 위아래로 유지할 호가 단계 수
    max-depth: 16           # 한쪽에 쌓일 수 있는 최대 호가 단계 수

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: SKALA Trading API
    description: 호가·체결 기반 증권 거래 시스템
    version: 0.0.1-SNAPSHOT

server:
  port: 8080

logging:
  level:
    com.sk.skala.trading: DEBUG
