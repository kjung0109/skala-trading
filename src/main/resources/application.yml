spring:
  application:
    name: skala-shop-api

  datasource:
    url: jdbc:h2:mem:tradingdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

app:
  jwt:
    # 운영에서는 환경변수로 주입한다. 소스에 비밀키를 두지 않는다.
    secret: ${JWT_SECRET:skala-shop-api-local-development-secret-key-please-change-in-production}
    validity-seconds: 3600
  account:
    initial-balance: 10000000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: SKALA SHOP API
    description: 스칼라 온라인 쇼핑몰 REST API
    version: 0.0.1-SNAPSHOT

server:
  port: 8080

logging:
  level:
    com.sk.skala.shopapi: DEBUG
